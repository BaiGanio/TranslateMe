<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TranslateMe spike: WebGPU test</title>
  <style>
    body { font: 15px/1.4 system-ui, sans-serif; max-width: 760px; margin: 2rem auto; padding: 0 1rem; }
    label { display: block; margin: .6rem 0 .2rem; font-weight: 600; }
    select, textarea, button { font: inherit; }
    textarea { width: 100%; box-sizing: border-box; }
    button { margin-top: .8rem; padding: .4rem 1rem; }
    #error { color: #b00020; font-weight: 600; }
    #output { min-height: 1.5em; padding: .5rem; background: #f3f3f3; white-space: pre-wrap; }
    #log { font: 12px/1.4 ui-monospace, monospace; background: #111; color: #ddd; padding: .5rem; white-space: pre-wrap; max-height: 320px; overflow: auto; }
  </style>
</head>
<body>
  <h1>TranslateMe spike: Qwen on WebGPU</h1>
  <p id="error"></p>

  <label for="model">Model</label>
  <select id="model">
    <option value="onnx-community/Qwen2.5-0.5B-Instruct">Qwen2.5-0.5B-Instruct</option>
    <option value="onnx-community/Qwen2.5-1.5B-Instruct">Qwen2.5-1.5B-Instruct</option>
  </select>
  <button id="load">Load model</button>

  <label for="source">Source line</label>
  <textarea id="source" rows="2">I can't believe we finally made it to the top of the mountain.</textarea>

  <label for="target">Target language</label>
  <select id="target">
    <option>Bulgarian</option>
    <option>Spanish</option>
    <option>German</option>
    <option>English</option>
  </select>
  <br>
  <button id="translate">Translate</button>

  <label>Output</label>
  <div id="output"></div>

  <label>Log</label>
  <div id="log"></div>

  <script type="module" src="./main.js"></script>
</body>
</html>
